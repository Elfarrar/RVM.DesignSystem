# Publica o site de documentacao em design.rvmit.com.br (GitHub Pages).
#
# Workflow PROPRIO, nao caller: o deploy.yml@v1 do RVM.Actions pressupoe `docker compose` e
# container, e este projeto nao tem nenhum dos dois (desvio declarado em 10-infra).
#
# Os tres detalhes que quebram Blazor WASM em host estatico (.nojekyll, 404.html, base href)
# sao resolvidos no publish pelo target PagesStaticHostFixups do .Docs.csproj, e conferidos
# aqui — se o target sumir num refactor, o guard reprova antes de publicar.
name: Deploy Pages

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: design-pages
  cancel-in-progress: false

jobs:
  build:
    name: Publish site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Publish
        run: dotnet publish src/RVM.DesignSystem.Docs/RVM.DesignSystem.Docs.csproj -c Release -o publish

      - name: Guards do host estatico
        run: |
          test -f publish/wwwroot/.nojekyll || { echo "::error::.nojekyll ausente — o Jekyll do Pages vai descartar _framework/."; exit 1; }
          test -f publish/wwwroot/404.html  || { echo "::error::404.html ausente — recarregar uma rota client-side vai devolver 404."; exit 1; }
          grep -q '<base href="/"' publish/wwwroot/index.html || { echo "::error::base href diferente de \"/\" — o site esta na raiz de dominio proprio."; exit 1; }
          test -d publish/wwwroot/_framework || { echo "::error::_framework/ ausente — o publish do WASM nao gerou o runtime."; exit 1; }
          grep -qx 'design.rvmit.com.br' publish/wwwroot/CNAME || { echo "::error::CNAME ausente ou errado — sem ele o Pages serve em /RVM.DesignSystem/ e o base href quebra."; exit 1; }
          echo "guards ok"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify
        run: |
          # Verificar CONTEUDO, nao so o codigo HTTP: host estatico com fallback devolve 200
          # para url inexistente e o status daria verde com a pagina errada no ar.
          #
          # A janela e generosa (10x30s) porque o certificado do dominio proprio leva alguns
          # minutos para propagar entre as bordas do Pages, e durante esse tempo o mesmo
          # endereco alterna entre 200 e erro de TLS conforme o no que atende.
          for i in $(seq 1 10); do
            body="$(curl -sS --max-time 20 -L https://design.rvmit.com.br || true)"
            if echo "$body" | grep -q "RVM Design System"; then
              echo "design.rvmit.com.br no ar e com o conteudo esperado (tentativa $i)"
              exit 0
            fi
            echo "::warning::design.rvmit.com.br ainda sem o conteudo esperado (tentativa $i/10)"
            sleep 30
          done
          echo "::error::Verificacao falhou apos 5 minutos."
          echo "::error::SE ESTE FOR O PRIMEIRO DEPLOY do repositorio, e esperado: o dominio proprio"
          echo "::error::so pode ser registrado DEPOIS que existe um deployment, entao o site publica"
          echo "::error::mas ainda nao responde em design.rvmit.com.br. Registrar o dominio e re-rodar:"
          echo "::error::  gh api -X PUT repos/\$GITHUB_REPOSITORY/pages -f cname=design.rvmit.com.br"
          echo "::error::  gh api -X PUT repos/\$GITHUB_REPOSITORY/pages -f cname=design.rvmit.com.br -F https_enforced=true"
          echo "::error::Fora do primeiro deploy: conferir o CNAME na zona rvmit.com.br e o estado do"
          echo "::error::certificado em 'gh api repos/\$GITHUB_REPOSITORY/pages'."
          exit 1
