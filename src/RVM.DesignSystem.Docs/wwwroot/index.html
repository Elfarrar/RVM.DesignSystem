<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RVM Design System</title>
    <meta name="description" content="Biblioteca de componentes Blazor do ecossistema RVM." />
    <!-- base href="/" porque o site fica na raiz de dominio proprio (10-infra § Deploy).
         Mudar para subcaminho exige mudar isto junto. -->
    <base href="/" />
    <!-- Anti-flash: SINCRONO e antes do CSS, de proposito. Sem ele quem usa tema escuro ve a
         pagina inteira em claro pelos segundos que o WASM leva para subir — nao um piscar,
         um erro visivel. -->
    <script src="_content/RVM.DesignSystem/js/rvm-theme-init.js"></script>
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="_content/RVM.DesignSystem/rvm-tokens.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/doc.css" />
    <!-- PREVIEW temporario de aparencia (DSGN-025). Sai quando a direcao for escolhida. -->
    <link rel="stylesheet" href="css/aparencia.css" />
    <script src="js/aparencia.js"></script>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="RVM.DesignSystem.Docs.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Tivemos um problema tecnico ao carregar a pagina.
        <a href="." class="reload">Recarregar</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
